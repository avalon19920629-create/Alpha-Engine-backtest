name: Phase 1 integration and R-by-N characterization
on:
  push:
    branches:
      - research/phase1-ttl-causal-fix-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Full repository pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Execute existing and new tests
        run: python -m pytest -q --disable-warnings --maxfail=8
      - name: Six-cell R×N smoke audit (synthetic prices)
        if: always()
        run: python phase1_rn_compare.py
      - name: Upload R×N smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-rn-demo-artifacts
          path: phase1_artifacts/
          if-no-files-found: warn
