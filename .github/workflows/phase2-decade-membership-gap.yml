name: Phase 2 Decade Constituent Membership Drift
on:
  push:
    branches: [research/phase2-decade-membership-drift-20261112]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historical_universe_gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt PyYAML
      - name: Download frozen member list
        run: |
          mkdir -p frozen_prices
          gh run download 43107722015 --repo "avalon19920629-create/Alpha-Engine-backtest" -n phase1-rn-realdata-exploratory -D frozen_prices
          test -s frozen_prices/universe.json
      - name: Pin historical constituent source
        run: |
          git clone --quiet https://github.com/shardul0701/SP500-Survivorship-bias-data-2004-2026.git historical_sp500
          git -C historical_sp500 checkout --quiet --detach 6ff2a610543d12e56b0290c83ed972c8954b8b41
      - name: Calculate decade-long membership gap
        run: python -u phase2_decade_membership_gap.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-decade-membership-gap
          path: phase2_decade_membership/
          retention-days: 30
          if-no-files-found: warn
