name: Phase 2 Historical S&P 500 Membership Sensitivity
on:
  push:
    branches:
      - research/phase2-historical-membership-audit-20261112
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pit_research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyarrow PyYAML
      - name: Recover immutable six-model price and selection snapshot
        run: |
          mkdir -p frozen_prices
          gh run download 43107722015 --repo "avalon19920629-create/Alpha-Engine-backtest" -n phase1-rn-realdata-exploratory -D frozen_prices
          ls -lh frozen_prices/
      - name: Fetch historical constituent evidence at pinned commit
        run: |
          git clone --quiet https://github.com/shardul0701/SP500-Survivorship-bias-data-2004-2026.git historical_sp500
          git -C historical_sp500 checkout --quiet --detach 6ff2a610543d12e56b0290c83ed972c8954b8b41
          test "$(git -C historical_sp500 rev-parse HEAD)" = "6ff2a610543d12e56b0290c83ed972c8954b8b41"
      - name: Compute dated membership intersection and performance sensitivity
        run: python -u phase2_point_in_time_membership.py
      - name: Upload complete research artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-pit-member-restriction-audit
          path: phase2_pit/
          if-no-files-found: warn
          retention-days: 30
