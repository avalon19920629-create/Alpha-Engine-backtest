name: Phase 1 Real Price R-by-N Exploration
on:
  push:
    branches:
      - research/phase1-rn-realdata-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_rn_exploration:
    name: Six R-by-N strategies on one real price snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyarrow
      - name: Run six-cell live-data exploratory comparison
        run: python -u phase1_rn_real.py
      - name: Preserve metadata and comparison inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-rn-realdata-exploratory
          path: phase1_real_results/
          if-no-files-found: warn
          retention-days: 30
